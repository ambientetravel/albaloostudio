# Albaloo Orchestration Pipeline — what a site actually ranks for.
# Architecture credit: Albaloo Studio — albaloostudio.com
# Owner: Alireza Mozaffari
#
# Dispatch-only. Answers "we are not on page one for our own keywords, why?"
# — which splits into two very different findings that a ranking table hides:
# the query is ABSENT (no listing exists) versus the query sits at position 40
# (a listing exists and is losing).

name: Query report — positions and absences

on:
  schedule:
    # Monday 07:00 UTC, after index-coverage (06:30): every site that declares
    # watch_terms in sites.yml, with the page Google shows for each term.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain to report on"
        required: true
        type: string
      watch:
        description: "Comma-separated terms to check for presence"
        required: false
        default: ""
        type: string
      top:
        description: "How many queries to list"
        required: false
        default: "30"
        type: string
      pages:
        description: "Also show which page ranks for each query"
        required: false
        default: false
        type: boolean
      trend:
        description: "Weekly clicks/impressions over 16 months, plus Search Console's sitemap status"
        required: false
        default: false
        type: boolean
      compare:
        description: "YYYY-MM-DD: per-page impressions before vs after this date (e.g. a go-live)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Report
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # the Monday watch: sites with watch_terms, terms from sites.yml
            for d in $(python3 -c "import config; print(' '.join(s.domain for s in config.load_sites(include_hold=True) if s.watch_terms))"); do
              python3 tools/query_report.py --domain "$d" --top 20 --pages | tee -a "$GITHUB_STEP_SUMMARY"
            done
            exit 0
          fi
          if [ "${{ inputs.trend }}" = "true" ] || [ -n "${{ inputs.compare }}" ]; then
            python3 tools/query_report.py --domain "${{ inputs.domain }}" --top "${{ inputs.top || '30' }}" \
              ${{ inputs.trend && '--trend' || '' }} ${{ inputs.compare && format('--compare {0}', inputs.compare) || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 tools/query_report.py \
            --domain "${{ inputs.domain }}" \
            --top "${{ inputs.top || '30' }}" \
            --watch "${{ inputs.watch }}" ${{ inputs.pages && '--pages' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
