# Albaloo Orchestration Pipeline — merge watch.
# Architecture credit: Albaloo Studio — albaloostudio.com
# Owner: Alireza Mozaffari
#
# Agent 2 opens a pull request and reports live_url: None, which is correct — a
# PR is not a page. Agents 3 and 4 both dereference live_url, so until something
# fills it in, two finished agents have never had a single real input.
#
# This runs DAILY rather than on merge, on purpose. A webhook would fire the
# moment the branch lands, and on these properties that is the wrong moment:
# boutimarfarsi merges do not reach Netafraz until a human uploads them. The
# question "is it live?" is answered by the server, and the server's answer
# changes hours or days after the merge. A daily poll costs nothing and asks at
# a time the answer might have changed.

name: Merge watch — which drafts went live

on:
  schedule:
    # 07:00 UTC daily. After the Monday dashboard at 06:00 so a promotion made
    # today appears on next week's page, and clear of every agent's window.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read      # to download Agent 2's latest output

concurrency:
  group: merge-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orchestrator

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Agent 2's output from the last several runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The last N successful runs, NOT just the latest.
          #
          # This read only the newest run and it made the whole tool
          # decorative. On 22 Aug four pull requests were merged and deployed,
          # and merge-watch reported "nothing to watch": the newest Agent 2 run
          # was a dry-run dispatch that drafted nothing, while the articles
          # being watched came from runs six days earlier. A draft becomes
          # invisible the moment ANY later run succeeds — which is precisely
          # when its pull request is most likely to be merged.
          #
          # Artifacts are kept 90 days, so ten runs is comfortably more history
          # than a review cycle needs, and each is small.
          # `completed`, not `success`: a writer run can draft articles, open their
          # PRs and still exit 1. Run #47 (6 Sep) did exactly that, and its PRs
          # boutimar#7 and #8 were invisible here — merged, then never watched, so
          # the Broadcaster would never have posted them. A run with no artifact
          # is already skipped by the download below.
          RUNS=$(gh run list --workflow agent2-writer.yml --status completed --limit 10                    --json databaseId --jq '.[].databaseId'                    --repo "${{ github.repository }}" 2>/dev/null || true)
          if [ -z "${RUNS:-}" ]; then
            echo "::notice title=Nothing to watch::Agent 2 has no successful run yet, so there are no drafts whose pull requests could have merged."
            exit 0
          fi

          mkdir -p written/events written/drafts
          FOUND=0
          for run in $RUNS; do
            rm -rf _dl && mkdir -p _dl
            if ! gh run download "$run" --name agent2-written --dir _dl                  --repo "${{ github.repository }}" 2>/dev/null; then
              continue          # artifact expired or that run uploaded none
            fi
            # Older runs are copied FIRST and newer ones overwrite, so when the
            # same article appears twice the most recent record wins — it is
            # the one carrying the pull request that actually exists.
            [ -d _dl/written/events ] && cp -Rn _dl/written/events/. written/events/ 2>/dev/null || true
            [ -d _dl/written/drafts ] && cp -Rn _dl/written/drafts/. written/drafts/ 2>/dev/null || true
            FOUND=$((FOUND+1))
          done

          COUNT=$(ls written/events 2>/dev/null | wc -l | tr -d ' ')
          echo "collected $COUNT event file(s) from $FOUND run artifact(s)"
          if [ "$COUNT" = "0" ]; then
            echo "::notice title=No drafts in any recent run::Agent 2 has run but produced no publishing events in the last 10 successful runs."
          fi

      - name: Restore articles promoted on earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # promoted/ used to exist only inside one run, so nothing remembered
          # that an article had gone live: it was re-announced every run while
          # its writer artifact was in the window, then silently dropped once it
          # aged out (Joybar and the Oil Show, 13 Sep). Collect the last ten
          # merge-watch artifacts, oldest first, so the newest record wins.
          mkdir -p promoted_prev
          RUNS=$(gh run list --workflow merge-watch.yml --status success --limit 10 \
                 --json databaseId --jq 'reverse | .[].databaseId' \
                 --repo "${{ github.repository }}" 2>/dev/null || true)
          for run in $RUNS; do
            rm -rf _mw && mkdir -p _mw
            gh run download "$run" --name merge-watch --dir _mw --repo "${{ github.repository }}" 2>/dev/null || continue
            DIR=$(find _mw -type d -name promoted | head -1 || true)
            [ -n "$DIR" ] && cp -R "$DIR"/. promoted_prev/ 2>/dev/null || true
          done
          echo "restored $(ls promoted_prev | wc -l | tr -d ' ') previously promoted article(s)"

      - name: Watch for merges that actually reached the server
        env:
          # The same token Agent 2 pushes with: it is the one scoped to the
          # content repositories whose pull requests are being read. The default
          # GITHUB_TOKEN can only see this repository.
          ASTRO_GITHUB_TOKEN: ${{ secrets.ASTRO_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -d written/events ] || exit 0
          mkdir -p reports promoted
          STAMP=$(date -u +%Y-%m-%d)
          # --previous is read-only history; --emit is this run's output. They
          # must differ: this tool runs twice per job, and when the second call
          # read the first call's output as history, the JSON report counted
          # every new article as "already live" and the summary said 0 newly live.
          python3 tools/merge_watch.py --written written --previous promoted_prev --emit promoted \
            --format md   --out "reports/merge-watch-$STAMP.md"
          python3 tools/merge_watch.py --written written --previous promoted_prev --emit promoted \
            --format json --out "reports/merge-watch-$STAMP.json"
          cat "reports/merge-watch-$STAMP.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Say what is stuck between merge and server
        if: always()
        run: |
          set -euo pipefail
          latest=$(ls -t reports/merge-watch-*.json 2>/dev/null | head -1 || true)
          [ -n "$latest" ] || exit 0
          python3 - "$latest" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1], encoding="utf-8"))
          live = [r for r in rows if r.get("state") == "live"]
          stuck = [r for r in rows if r.get("state") == "MERGED, NOT DEPLOYED"]
          for r in stuck:
              print(f"::warning title=Merged but not deployed::{r.get('title') or r['name']} "
                    f"— {r.get('intended_url')} : {r.get('detail')}")
          # Never a failure. An article waiting on an upload is a queue, not a
          # broken build, and failing here would make the daily run red for as
          # long as a human takes to deploy.
          print(f"{len(live)} newly live, {len(stuck)} merged but not deployed, "
                f"{len(rows)} watched")
          PY

      - name: Upload promoted events and the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          # Agent 3 reads `promoted/` — these are publishing.event.v1 files that
          # now carry a verified live_url, which is the input it has never had.
          name: merge-watch
          path: |
            orchestrator/reports/
            orchestrator/promoted/
          retention-days: 90
          if-no-files-found: warn
