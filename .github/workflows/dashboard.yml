# Portfolio dashboard
# Architecture credit: Albaloo Studio — albaloostudio.com
# Owner: Alireza Mozaffari
#
# Everything the pipeline knows lives in eight separate job summaries, which
# means it is read by whoever opens the right tab on the right day. Alireza
# asked for an HTML view on 16 Aug 2026. This is it.
#
# It is DELIBERATELY NOT DEPLOYED. The page carries competitor research, per-run
# cost, and drafts nobody has reviewed — none of which belongs on a public site.
# It is uploaded as an artifact, which requires a GitHub login to download. If
# it is ever hosted, it needs auth in front of it first.
#
# Reads the latest SUCCESSFUL run of each agent independently, so one agent
# having a bad day does not blank the whole page — a missing input renders as
# "no manifest found", never as a zero.

name: Portfolio dashboard

on:
  schedule:
    # Mondays 06:00 UTC — after agent 5+6 (05:00) and agent 7 (05:30), so a
    # week's worth of runs is complete before it is summarised.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read      # to list and download the other workflows' artifacts

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: orchestrator

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Each agent resolved separately and allowed to fail. `|| true` is the
      # point: agent 8 having no successful run yet must not stop the page from
      # showing agent 1 and 2, which is exactly the failure mode that makes
      # dashboards get abandoned.
      - name: Collect the agents' latest manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          grab () {                 # $1 workflow file, $2 artifact name, $3 dest
            run=$(gh run list --workflow "$1" --status success --limit 1 \
                    --json databaseId --jq '.[0].databaseId' \
                    --repo "${{ github.repository }}" 2>/dev/null || true)
            if [ -z "${run:-}" ] || [ "$run" = "null" ]; then
              echo "::notice title=No data from $1::No successful run to read. That section of the dashboard will say so rather than showing a zero."
              return 0
            fi
            mkdir -p "$3"
            gh run download "$run" --name "$2" --dir "$3" \
               --repo "${{ github.repository }}" 2>/dev/null \
              || echo "::notice title=Artifact missing::$2 not present on run $run."
          }
          grab agent1-seo-scout.yml        seo-scout-run        _dl/agent1
          grab agent2-writer.yml           agent2-written       _dl/agent2
          grab agent8-competitor-scout.yml competitor-scout     _dl/agent8
          # Agents 5+6 (audit and strategy) and 7 (geography) both publish into
          # reports/. They are the half of this pipeline that says what to WRITE
          # rather than whether the machine ran, and the first dashboard left
          # them out entirely.
          grab agent5-site-audit.yml       site-audit           _dl/agent56
          grab agent7-keyword-geo.yml      keyword-geo-reports  _dl/agent7

          # The artifacts preserve their own directory shape, so move each into
          # the layout build_dashboard.py looks for rather than teaching the
          # generator about GitHub's packaging.
          mkdir -p runs written competitors reports
          [ -d _dl/agent1 ] && cp -R _dl/agent1/. runs/ 2>/dev/null || true
          [ -d _dl/agent2 ] && cp -R _dl/agent2/written/. written/ 2>/dev/null || true
          [ -d _dl/agent8 ] && cp -R _dl/agent8/. competitors/ 2>/dev/null || true
          # agent 5+6 uploads reports/ AND runs/; take only reports so its copy
          # of runs/ cannot shadow agent 1's newer scout manifest.
          [ -d _dl/agent56/reports ] && cp -R _dl/agent56/reports/. reports/ 2>/dev/null || true
          [ -d _dl/agent7 ] && cp -R _dl/agent7/. reports/ 2>/dev/null || true
          echo "collected:"; ls -d runs written competitors reports 2>/dev/null || true
          ls reports/ 2>/dev/null | head -8 || true

      - name: Build the page
        run: python3 tools/build_dashboard.py --out dashboard.html

      - name: Show it in the run summary too
        run: |
          set -euo pipefail
          {
            echo "## Portfolio dashboard"
            echo
            echo "Built \`dashboard.html\` — download it from **Artifacts** below."
            echo
            echo "> Not deployed anywhere on purpose: it carries competitor research,"
            echo "> per-run cost and unreviewed drafts. The artifact needs a GitHub"
            echo "> login to fetch, which is the access control."
            echo
            echo "\`\`\`"
            # A plain-text digest so the numbers are visible without downloading.
            python3 - <<'PY'
          import json, pathlib
          for label, p in (("agent 1", "runs"), ("agent 2", "written"),
                           ("agent 8", "competitors")):
              hits = list(pathlib.Path(p).rglob("*.json")) if pathlib.Path(p).exists() else []
              print(f"{label:8} {'found' if hits else 'no manifest'}")
          PY
            echo "\`\`\`"
            echo
            echo "*Architecture credit: Albaloo Studio*"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dashboard
          path: orchestrator/dashboard.html
          retention-days: 90
          if-no-files-found: warn

      # ── dashboard.boutimar.com ──────────────────────────────────────────
      # Same shape as deploy-albaloostudio.yml: lftp to a scoped FTP account
      # held in GitHub's secret store and revocable by deleting the account.
      #
      # TWO destinations, and the split is the whole security model:
      #   public_html/index.php   the password gate
      #   private/dashboard.html  the data, OUTSIDE the web root
      #
      # Netafraz serves static files through nginx directly — which is why
      # Header and Expires rules on this host only ever reached PHP. A
      # dashboard.html sitting in public_html would therefore be readable by
      # anyone with the URL no matter what .htaccess said. Putting it outside
      # the root is not belt-and-braces; it is the only thing that works here.
      - name: Install lftp
        if: success()
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy to dashboard.boutimar.com
        if: success()
        env:
          FTP_HOST: ${{ secrets.DASHBOARD_FTP_HOST }}
          FTP_USER: ${{ secrets.DASHBOARD_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.DASHBOARD_FTP_PASSWORD }}
          PW_HASH: ${{ secrets.DASHBOARD_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_HOST:-}" ] || [ -z "${FTP_USER:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::notice title=Not deployed::DASHBOARD_FTP_* secrets are not set, so the page was built and uploaded as an artifact only. See orchestrator/SETUP-DASHBOARD.md."
            exit 0
          fi
          if [ -z "${PW_HASH:-}" ]; then
            echo "::error title=No password hash::DASHBOARD_PASSWORD_HASH is not set. Refusing to deploy — index.php fails closed on a missing hash, but shipping an ungated page is not something to risk on that."
            exit 1
          fi

          mkdir -p _pub _priv
          cp ../dashboard-site/index.php _pub/index.php
          cp dashboard.html _priv/dashboard.html
          # The hash, never the password. Written as PHP so it is not servable
          # as text even if it somehow lands inside the web root.
          #
          # Checked before writing: a bcrypt hash is $2y$<cost>$<53 chars> and
          # contains no quote or backslash, which is why a bare printf is safe
          # here. Anything else is a pasting accident, and an auth file built
          # from one would fail open-ish in confusing ways.
          case "$PW_HASH" in
            \$2y\$*|\$2b\$*|\$2a\$*) : ;;
            *) echo "::error title=Not a bcrypt hash::DASHBOARD_PASSWORD_HASH does not start with \$2y\$. Generate it with the command in SETUP-DASHBOARD.md and store the HASH, not the password."; exit 1 ;;
          esac
          printf "<?php return '%s';\n" "$PW_HASH" > _priv/dashboard-auth.php

          # mirror -R uploads a directory; two calls because the destinations
          # are siblings, not nested.
          lftp -c "
            set ftp:ssl-allow true;
            set ssl:verify-certificate false;
            set net:max-retries 2; set net:timeout 20;
            open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
            mkdir -p private;
            mirror -R --only-newer --verbose _pub  public_html;
            mirror -R --only-newer --verbose _priv private;
            bye
          "
          echo "deployed"

      - name: Verify the gate is actually gating
        if: success()
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.DASHBOARD_FTP_HOST }}" ]; then exit 0; fi
          sleep 8
          fail=0
          # The page must answer, and must NOT contain the dashboard itself.
          body=$(curl -sS -L --max-time 25 https://dashboard.boutimar.com/ || true)
          case "$body" in
            *"Albaloo orchestration"*) echo "gate renders ✓" ;;
            *) echo "::error::dashboard.boutimar.com did not return the login page"; fail=1 ;;
          esac
          case "$body" in
            *"Can each site receive an article"*)
              echo "::error title=NOT GATED::The dashboard content was served without a password."
              fail=1 ;;
            *) echo "content withheld until sign-in ✓" ;;
          esac
          # And the data file must not be reachable directly.
          for p in dashboard.html private/dashboard.html ../private/dashboard.html; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 "https://dashboard.boutimar.com/$p" || echo 000)
            if [ "$code" = "200" ]; then
              echo "::error title=Data file exposed::/$p returned 200 — it must not be servable."
              fail=1
            else
              echo "/$p  $code ✓"
            fi
          done
          exit $fail
