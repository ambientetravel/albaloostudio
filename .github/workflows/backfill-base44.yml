name: Backfill — pre-adapter drafts into base44

# One-shot. Sends the drafts in orchestrator/backfill/base44/ (written before the
# base44_entity adapter existed) into their base44 apps as DRAFT records —
# re-scrubbed and re-checked under today's rules first. Safe to re-run: records
# are upserted by slug and a PUBLISHED record is never touched.
# Nothing becomes public: a human flips status to "published" in base44.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write to base44 (unticked = dry run that only prints)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Backfill
        env:
          BASE44_ACCESS_TOKEN: ${{ secrets.BASE44_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python3 tools/backfill_base44.py --apply | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 tools/backfill_base44.py | tee -a "$GITHUB_STEP_SUMMARY"
          fi
