# Agent 2 — Writer
# Architecture credit: Albaloo Studio — albaloostudio.com
# Owner: Alireza Mozaffari
#
# Chained off Agent 1 with workflow_run rather than woken by a webhook.
#
# BASE44-AGENT2.md specified an external HTTP service, so Agent 1 signed an
# HMAC and POSTed to it. base44 turned out not to be able to do the job — six
# of the ten sites need git or filesystem writes it does not have, the raw-body
# HMAC is hostile to platforms that pre-parse JSON, and drafting takes 30–90s
# which is not a request handler's work.
#
# Running here removes the transport entirely. Agent 2 reads Agent 1's artifact
# directly: no webhook, no signature to verify, no AGENT2_WEBHOOK_URL — the
# secret whose absence killed the nightly cron on 9 Aug. Fewer moving parts,
# not more.
#
# Agent 3 followed for the same reasons and chains off this workflow the same
# way. The signed-webhook design now applies only to callers outside this repo;
# every internal hop is a workflow_run.

name: Agent 2 — Writer

on:
  workflow_run:
    workflows: ["Agent 1 — SEO Scout"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Agent 1 run ID to take briefs from (blank = latest successful)"
        required: false
        type: string
      domain:
        description: "Restrict to one domain"
        required: false
        type: string
      limit:
        description: "Max briefs to write (0 = all)"
        required: false
        default: "5"
        type: string
      no_llm:
        description: "Skip Gemini — exercise parsing, gate and adapters only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read      # needed to download the upstream run's artifact

concurrency:
  # Two writers on the same briefs would draft the same article twice. The
  # idempotency key guards the payload, not the compute.
  group: agent2-writer
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A failed scout produces no briefs worth writing. Skip rather than run and
    # report an empty success, which reads as "nothing to do" when it means
    # "the upstream broke".
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    defaults:
      run:
        working-directory: orchestrator

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # On workflow_run this comes free. On a manual dispatch with no run_id
      # BOTH sources are empty, and download-artifact fails with a confusing
      # "unable to find artifact" rather than "you did not say which run" — so
      # resolve the latest successful scout instead of making someone paste an
      # ID they have to go and look up.
      - name: Resolve which scout run to read
        id: scout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN="${{ inputs.run_id || github.event.workflow_run.id }}"
          if [ -z "$RUN" ]; then
            RUN=$(gh run list --workflow agent1-seo-scout.yml --status success \
                    --limit 1 --json databaseId --jq '.[0].databaseId' \
                    --repo "${{ github.repository }}")
            if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
              echo "::error title=No scout run::No successful Agent 1 run to take briefs from. Run the scout first."
              exit 1
            fi
            echo "::notice title=Using latest scout run::$RUN"
          fi
          echo "run_id=$RUN" >> "$GITHUB_OUTPUT"

      - name: Fetch the briefs Agent 1 produced
        uses: actions/download-artifact@v4
        with:
          name: seo-scout-run
          path: orchestrator/inbox
          run-id: ${{ steps.scout.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate the briefs
        id: locate
        run: |
          set -euo pipefail
          # The artifact preserves runs/<run_id>/briefs/. Find the one that has
          # briefs in it rather than assuming a path — a run with zero
          # candidates produces a manifest and no briefs directory at all.
          DIR=$(find inbox -type d -name briefs | head -1 || true)
          if [ -z "$DIR" ] || [ -z "$(ls -A "$DIR" 2>/dev/null)" ]; then
            echo "::notice title=Nothing to write::Agent 1 emitted no briefs in that run."
            echo "found=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=$DIR" >> "$GITHUB_OUTPUT"
          echo "$(ls "$DIR" | wc -l) brief(s) in $DIR"

      - name: Draft, gate and stage
        if: steps.locate.outputs.found != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Flash, not Pro. Pro is absent from the free tier and answers every
          # request with 429 "limit: 0", which reads as rate-limiting and is
          # not. Set the GEMINI_MODEL repository variable to override once
          # billing is enabled on the key's project.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          # astro_pr — boutimar.com and exploreorient.com. The token needs
          # contents:write and pull_requests:write on the TARGET repo; the
          # runner's own GITHUB_TOKEN is scoped to this repo and cannot open a
          # PR on another. Absent, the adapter stages to bundles/ and says so.
          # Per-site vars win over the shared one, because the two sites are
          # different repositories.
          ASTRO_REPO_BOUTIMAR_COM: ${{ vars.ASTRO_REPO_BOUTIMAR_COM }}
          ASTRO_REPO_EXPLOREORIENT_COM: ${{ vars.ASTRO_REPO_EXPLOREORIENT_COM }}
          ASTRO_REPO: ${{ vars.ASTRO_REPO }}
          ASTRO_GITHUB_TOKEN: ${{ secrets.ASTRO_GITHUB_TOKEN }}
          # WordPress. Absent until set, in which case the adapter stages the
          # draft and says so rather than pretending to publish. An Application
          # Password, never the account password — revocable on its own and
          # scoped to the REST API.
          WORDPRESS_USER: ${{ secrets.WORDPRESS_USER }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          PIPELINE_ENVIRONMENT: production
        run: |
          set -euo pipefail
          ARGS="--briefs ${{ steps.locate.outputs.found }} --out written"
          if [ -n "${{ inputs.domain }}" ]; then ARGS="$ARGS --domain ${{ inputs.domain }}"; fi
          # This fallback, not the input default, is what governs the nightly
          # run — workflow_run carries no inputs. Both say 5; a limit that
          # lives in two places and disagrees is the same bug as the model
          # default that shipped as flash in config.py and pro in this file.
          if [ "${{ inputs.limit || '5' }}" != "0" ]; then ARGS="$ARGS --limit ${{ inputs.limit || '5' }}"; fi

          # Without a key, run the structural path instead of failing. Same
          # reasoning as the scout's missing-endpoint guard: a cron that is red
          # for a known, documented gap is a cron nobody reads. Self-healing —
          # the day GEMINI_API_KEY exists, real drafting starts with no edit.
          if [ "${{ inputs.no_llm }}" = "true" ] || [ -z "${GEMINI_API_KEY:-}" ]; then
            if [ -z "${GEMINI_API_KEY:-}" ]; then
              echo "::notice title=No Gemini key::GEMINI_API_KEY is not set. Running --no-llm: parsing, the compliance gate, the CMS adapters and event assembly are all exercised, but the drafts are assembled from the briefs and are NOT publishable."
            fi
            ARGS="$ARGS --no-llm"
          fi

          python3 agent2_writer_batch.py $ARGS

      - name: Summarise
        if: always() && steps.locate.outputs.found != ''
        run: |
          set -euo pipefail
          [ -f written/manifest.json ] || exit 0
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("written/manifest.json", encoding="utf-8"))
          print("## Agent 2 — Writer\n")
          if m.get("no_llm"):
              print("> **Structural run — no model was called.** The drafts below are "
                    "assembled from the briefs and are not publishable.\n")
          print(f"{m['drafted']} drafted · {m['blocked']} blocked · "
                f"{m.get('deferred_upstream', 0)} deferred · {m['failed']} failed "
                f"(of {m['briefs_seen']} briefs)\n")
          if m.get("deferred_by_limit"):
              print(f"> {m['deferred_by_limit']} brief(s) deferred to the next run by "
                    f"the per-run limit. Briefs are taken one per site in rotation, so "
                    f"the limit never spends a whole run on one domain.\n")
          if m.get("deferred_upstream"):
              print(f"> **{m['deferred_upstream']} brief(s) deferred — the model was "
                    f"busy.** Overloaded or rate-limited; the reason for each is "
                    f"under *Not drafted* below. Nothing is wrong with these briefs "
                    f"and nothing needs fixing; they draft on the next run.\n")
          u = m.get("usage") or {}
          if u.get("calls"):
              cost = u.get("estimated_cost_usd")
              # "unpriced" and "$0.00" mean opposite things and the difference
              # is the whole point of printing this. A missing rate must never
              # render as free.
              shown = f"~${cost:.4f}" if cost is not None else (
                  f"unpriced ({', '.join(u.get('unpriced_models') or ['unknown model'])})")
              print(f"**Tokens** — {u['input_tokens']:,} in / {u['output_tokens']:,} out "
                    f"over {u['calls']} call(s) · estimated cost **{shown}**  \n")
              print("<sub>Cost uses the rate table in `config.py`, which is a recorded "
                    "assumption, not a live price. Verify against the vendor's pricing "
                    "page; override with `TOKEN_PRICES_JSON`.</sub>\n")
          if m.get("domains_written"):
              print(f"Sites written: {', '.join(m['domains_written'])}\n")
          if m.get("domains_skipped"):
              print(f"Sites skipped: {', '.join(m['domains_skipped'])}\n")
          print("| Site | Keyword | Status | Target | Words |")
          print("|---|---|---|---|---:|")
          for o in m["outcomes"]:
              print(f"| {o['domain']} | {o['keyword']} | {o['status']} | "
                    f"`{o['target_url']}` | {o['words']} |")
          # A failed brief printed a row of zeros and nothing else, so the only
          # way to learn the cause was to expand a collapsed log step by hand.
          # Same gap Agent 1 had; same fix.
          # Where each drafted article actually WENT. "drafted" only means the
          # model produced text and the gate passed it — run #25 said "2 drafted"
          # while the astro_pr adapter caught a RequestException on both, opened
          # no pull request and staged no file, and nothing printed the reason.
          done = [o for o in m["outcomes"] if o["status"] == "drafted"]
          if done:
              print("\n### Where the drafts went\n")
              lost = []
              for o in done:
                  if o.get("pr_url"):
                      print(f"- **{o['domain']}** — pull request: {o['pr_url']}")
                  elif o.get("staged_path"):
                      print(f"- **{o['domain']}** — staged to `{o['staged_path']}` "
                            f"(not published): {o.get('cms_note') or 'no reason given'}")
                  else:
                      lost.append(o)
                      print(f"- **{o['domain']}** — ⚠️ **no pull request and no staged "
                            f"file**: {o.get('cms_note') or 'the adapter gave no reason'}")
              if lost:
                  print(f"\n> ### {len(lost)} article(s) were written and went nowhere\n>\n"
                        f"> The model produced text and the compliance gate passed it, but "
                        f"the CMS adapter neither published nor staged it. The words were "
                        f"paid for and lost. This is a configuration or credential fault, "
                        f"not a content one — the reason is on each line above.\n")
          failed = [o for o in m["outcomes"] if o["status"] in ("failed", "deferred")]
          if failed:
              print("\n### Not drafted\n")
              for o in failed:
                  print(f"- **{o['domain']}** — {o['status']}: {o['error']}")
          blocked = [o for o in m["outcomes"] if o["status"] == "blocked"]
          if blocked:
              print("\n### Blocked by the compliance gate\n")
              for o in blocked:
                  for v in o["violations"][:2]:
                      print(f"- **{o['domain']}** — `{v.get('rule')}`: {str(v.get('excerpt'))[:160]}")
          # Show one file exactly as it would land in the target repo. Until a
          # token exists these are staged to bundles/ and reviewable only by
          # downloading a zip, which nobody does — so the thing you are being
          # asked to approve is invisible at the moment you would approve it.
          import glob, itertools
          staged = sorted(glob.glob("bundles/**/*.md", recursive=True))
          if staged:
              body = open(staged[0], encoding="utf-8").read()
              head = "".join(itertools.islice(iter(body.splitlines(keepends=True)), 60))
              print(f"\n### Preview — `{staged[0]}`\n")
              print("This is the file byte-for-byte as it would be committed.\n")
              print("```markdown")
              print(head.rstrip())
              if len(body.splitlines()) > 60:
                  print(f"\n… {len(body.splitlines()) - 60} more line(s), "
                        f"{len(body.split())} words total")
              print("```")
          print("\n*Architecture credit: Albaloo Studio*")
          PY

      - name: Upload drafts and events
        if: always() && steps.locate.outputs.found != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent2-written
          # bundles/ holds the files the CMS adapters staged rather than
          # published — for astro_pr that is the exact markdown a pull request
          # would contain. It was being written and then thrown away with the
          # runner, so the one artefact worth reviewing never left the machine.
          path: |
            orchestrator/written/
            orchestrator/bundles/
          retention-days: 90
          if-no-files-found: warn
