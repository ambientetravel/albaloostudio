# Albaloo Orchestration Pipeline — Agent 1 trigger.
# Architecture credit: Albaloo Studio — albaloostudio.com
# Owner: Alireza Mozaffari

name: Agent 1 — SEO Scout

on:
  schedule:
    # 04:15 UTC on SUNDAYS — weekly, not nightly (changed 12 Aug 2026).
    #
    # Nightly was wrong on three counts, only one of them cost.
    #
    # 1. It re-read the same data. Search Console lags ~2 days and the script
    #    queries back from today-3d over a 90-day window, so consecutive nights
    #    differ by one day in ninety. Runs #8, #9 and #10 surfaced the same
    #    keywords — toranj marine hotel, tehran boutique hotel, alamut castle —
    #    because the gap set genuinely had not changed.
    # 2. It outran the humans. Agent 2 drafts 5 articles per scout run. Nightly
    #    is 35 a week to review, edit and publish; nobody was ever going to.
    #    The bottleneck in this pipeline is review, not scouting.
    # 3. It cost the most on the model that costs the most — one Opus 5 call
    #    per property per night emptied a $5 balance in four days.
    #
    # Sunday so the briefs and drafts are waiting on Monday morning, and clear
    # of the Monday 05:00/05:30 audit jobs. Dispatch any time for a fresh look.
    - cron: "15 4 * * 0"
  workflow_dispatch:
    inputs:
      domain:
        description: "Restrict to one domain (blank = all ten)"
        required: false
        type: string
      limit:
        description: "Max briefs per domain"
        required: false
        default: "5"
        type: string
      dry_run:
        description: "Build briefs but deliver nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Never let two scouts run at once — at-least-once delivery plus a second
  # concurrent run is how the same gap becomes two articles.
  group: agent1-seo-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: orchestrator

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Search Console access
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        # Fails ONLY when the service account can read nothing at all — a broken
        # key or a grant process that never happened. Properties still pending
        # are listed as a warning and the run proceeds with what IS granted;
        # blocking three working sites on five ungranted ones helps nobody.
        run: python agent1_seo_scout.py --list-properties

      - name: Run the scout
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # The gap analysis runs on Gemini (GAP_ANALYSIS_PROVIDER default).
          # It moved off Anthropic on 12 Aug 2026: this is the pipeline's
          # highest-volume model call — once per property, every night, up to
          # 16k output tokens at $25/M on Opus 5 — and it emptied the $5 balance
          # in four days. Gemini's free tier has no balance to exhaust.
          #
          # Whichever provider is selected, a missing key does NOT fail the
          # step: it drops to the deterministic fallback, which the run now
          # announces as DEGRADED rather than passing off as a normal result.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          # Kept so GAP_ANALYSIS_PROVIDER=anthropic works the moment the balance
          # is topped up — no edit here, just the repository variable.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Sonnet, not Opus. Classify / deduplicate / rank / outline against a
          # fixed schema is not Opus work, and this is the only agent that runs
          # on a schedule of its own — it paid the top rate most often. Set the
          # GAP_ANALYSIS_MODEL variable to claude-haiku-4-5 to go cheaper still.
          # Agents 3, 4 and 6 keep ANTHROPIC_MODEL for prose and strategy.
          GAP_ANALYSIS_MODEL: ${{ vars.GAP_ANALYSIS_MODEL || 'claude-sonnet-5' }}
          GAP_ANALYSIS_PROVIDER: ${{ vars.GAP_ANALYSIS_PROVIDER || 'gemini' }}
          # Kept so GAP_ANALYSIS_PROVIDER=openai still works if you switch back.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
          AGENT2_WEBHOOK_URL: ${{ secrets.AGENT2_WEBHOOK_URL }}
          AGENT3_WEBHOOK_URL: ${{ secrets.AGENT3_WEBHOOK_URL }}
          PIPELINE_ENVIRONMENT: production
        run: |
          ARGS="--limit ${{ inputs.limit || '5' }}"
          if [ -n "${{ inputs.domain }}" ]; then ARGS="$ARGS --domain ${{ inputs.domain }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi

          # The hand-off to Agent 2 is the run artifact, not a webhook. Agent 2
          # runs in this same repo on workflow_run and downloads seo-scout-run,
          # so there is no endpoint to POST to and no signature to verify — one
          # less credential. AGENT2_WEBHOOK_URL survives only for an external
          # consumer; when it is unset, which is the normal state, the scout
          # skips the POST rather than failing on a missing secret.
          if [ -z "$AGENT2_WEBHOOK_URL" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "::notice title=Briefs hand off via artifact::No external webhook configured. Briefs are archived as seo-scout-run and Agent 2 picks them up on workflow_run — this is the designed path, not a gap."
            ARGS="$ARGS --dry-run"
          fi

          python agent1_seo_scout.py $ARGS

      # Agent 1 is green whether or not its LLM answered, on purpose — losing
      # every domain's GSC work to one provider outage is worse. But run #10
      # finished in 47 seconds instead of six minutes, emitted 14 briefs with no
      # consensus figure and no proprietary fact, and looked identical to a good
      # run on this page. The only tell was the duration.
      - name: Say so if the run was degraded
        if: always()
        run: |
          set -euo pipefail
          M=$(find runs -name manifest.json -maxdepth 3 2>/dev/null | head -1 || true)
          [ -n "$M" ] || exit 0
          # The summary is written to its file directly so stdout stays free for
          # workflow commands — a ::warning piped into the summary is a line of
          # grey text, not an annotation, and this is precisely the run state
          # that must not be quiet.
          python3 - "$M" <<'PY'
          import json, os, sys
          m = json.load(open(sys.argv[1], encoding="utf-8"))
          t = m.get("totals", {})
          deg, tot = t.get("degraded_briefs", 0), t.get("briefs_emitted", 0)
          doms = ", ".join(m.get("degraded_domains", []))
          out = ["## Agent 1 — SEO Scout\n",
                 f"{tot} brief(s) from {len(m.get('domains', []))} propert(ies) · "
                 f"provider: `{m.get('analysis_provider') or 'none'}`\n"]
          if deg:
              out.append(
                  f"> ### {deg} of {tot} briefs are DEGRADED\n>\n"
                  f"> The gap-analysis model was unavailable for: **{doms}**. Those "
                  f"briefs carry no consensus figure, no proprietary fact and an "
                  f"unranked slug for a URL. Agent 2 skips them rather than paying "
                  f"for a draft that cannot pass the content rules; Agent 1 "
                  f"re-scouts the same gaps on the next run.\n")
              # degraded_reasons is already a set, but four sites failing on
              # one exhausted balance produced four request_ids and so four
              # distinct strings. Cut at the request_id.
              seen = []
              for r in m.get("degraded_reasons", []):
                  head = r.split("'request_id'")[0].rstrip(", {")
                  if head not in seen:
                      seen.append(head)
              for head in seen:
                  out.append(f"> **Why:** `{head}`\n")
          if m.get("not_granted"):
              out.append(f"> Not granted: {', '.join(m['not_granted'])}\n")
          out.append("\n*Architecture credit: Albaloo Studio*\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(out))
          if deg:
              why = " | ".join(seen) or "no reason recorded"
              print(f"::warning title=Degraded run::{deg} of {tot} briefs were built "
                    f"without the LLM step ({doms}). Cause: {why}")
          PY

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-scout-run
          path: orchestrator/runs/
          retention-days: 90
          if-no-files-found: warn
