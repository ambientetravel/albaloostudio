name: Backfill — photos for live articles that have none

# One-shot. Finds a real, freely licensed Wikimedia Commons photo (credit copied
# from the file's own licence record) for every live article without one, on
# boutimar.com, exploreorient.com and boutimar.ir. With apply ticked it opens ONE
# pull request per site on an agent2/ branch, so the photos land on the Notion
# Content Review board for approval. Nothing goes live from this run itself.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Open the pull requests (unticked = dry run that only prints)"
        type: boolean
        default: false
      only:
        description: "Only these repos (comma list, e.g. cruise24-ir); blank = all"
        required: false
        default: ""
      slug:
        description: "Only articles whose slug contains this (e.g. norouz-2027); blank = all"
        required: false
        default: ""
      file:
        description: "Use this exact Commons file (needs a slug matching ONE article)"
        required: false
        default: ""
      crop:
        description: "Crop fractions left,top,width,height (e.g. 0,0.3223,1,0.3164)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - run: pip install -r requirements.txt
      - name: Backfill
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRO_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE44_ACCESS_TOKEN: ${{ secrets.BASE44_ACCESS_TOKEN }}
          PROSE_PROVIDER: anthropic
        run: |
          ARGS=""
          for r in $(echo "${{ inputs.only }}" | tr ',' ' '); do ARGS="$ARGS --only $r"; done
          if [ -n "${{ inputs.slug }}" ]; then ARGS="$ARGS --slug ${{ inputs.slug }}"; fi
          FILE_ARG="${{ inputs.file }}"; CROP_ARG="${{ inputs.crop }}"
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          python3 tools/backfill_images.py $ARGS --file "$FILE_ARG" --crop "$CROP_ARG" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the base44 record backups
        # base44 records are edited in place (no PR); the pre-edit copy of every
        # record touched is kept here for 90 days.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base44-photo-backups
          path: orchestrator/runs/base44-photo-backup-*
          if-no-files-found: ignore
          retention-days: 90
