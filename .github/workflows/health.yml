name: Health — what broke, what needs you

# One report that leads with the failures. It runs after every writer/broadcaster
# cycle and once a day, reads the agents' own artifacts, and goes RED when a
# core agent failed or produced nothing — the one signal GitHub emails about
# without any new infrastructure. A PR waiting on a merge is yellow, not red.

on:
  workflow_run:
    workflows: ["Agent 2 — Writer", "Agent 3 — Broadcaster"]
    types: [completed]
  schedule:
    - cron: "0 7 * * *"          # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write     # commits reports/health-latest.md back, like the ledger
  actions: read       # read other workflows' runs + artifacts

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the health report
        id: report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIDGE_GH_TOKEN: ${{ secrets.BRIDGE_GH_TOKEN }}
        run: |
          set -uo pipefail
          cd orchestrator
          # GitHub runs this under `bash -e`. The report's exit code IS the
          # verdict (0 clean / 1 needs you / 2 broke), and with -e a 2 aborted
          # the step here — before the commit and the deliberate red/yellow
          # decision below ever ran. Capture it, never let it abort.
          set +e
          python3 tools/health_report.py --json | tee /tmp/health.md
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/health.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the report
        run: |
          set -euo pipefail
          git config user.name "albaloo-health"
          git config user.email "albaloo-health@users.noreply.github.com"
          # orchestrator/reports is gitignored on purpose (per-run copies stay
          # out of git). Force-add only the two 'latest' files.
          files="orchestrator/reports/health-latest.md orchestrator/reports/health-latest.json"
          msg="Health: $(head -1 orchestrator/reports/health-latest.md | sed 's/^# //')"
          git add -f $files
          git diff --cached --quiet && exit 0
          git commit -q -m "$msg"
          # A push race is not a broken pipeline. On 6 Oct four Health runs went
          # red (and emailed) only because main moved while they ran. Rebuild the
          # commit on the newest main — the two report files ONLY; a mixed reset
          # never carries this checkout's stale copy of anything else — and retry.
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && exit 0
            sleep $((i * 4))
            git fetch -q origin main
            git reset -q origin/main
            git add -f $files
            git diff --cached --quiet && exit 0
            git commit -q -m "$msg"
          done
          echo "::warning title=Report not committed::main kept moving; the report is still in this run's summary."
          exit 0
      - name: Go red only when something actually broke
        run: |
          code="${{ steps.report.outputs.code }}"
          echo "health exit code: $code (0 clean · 1 needs you · 2 broke · 4 no token)"
          if [ "$code" = "2" ] || [ "$code" = "4" ]; then exit 1; fi
          exit 0
