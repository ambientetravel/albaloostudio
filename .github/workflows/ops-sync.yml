name: Ops sync — Review queue (Albaloo Ops app)

# Phase 1 of OPS-APP.md. Open article drafts on the Notion Content Review board
# → ArticleReview rows in the Albaloo Ops base44 app (6ade14ab5b5e6721cc424fbe);
# a decision pressed in the app → Status (+ Feedback) on the Notion row, where the
# hourly review sync acts on it; a new draft → a Notion @mention ping to Alireza.
# GitHub stays the source of truth; base44 never calls GitHub. tools/ops_sync.py
# Seeded 25 Oct 2026: 34 drafts (run 40207408284); dry run before and after.

on:
  schedule:
    # Hourly, 25 min after the Notion review sync (:15) — an app decision reaches
    # Notion within the hour and is acted on at the next review sync.
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = read-only GET of ArticleReview; dry_run = report only; apply = write"
        type: choice
        options: [probe, dry_run, apply, images_dry_run, images_apply]
        default: dry_run

permissions:
  contents: read
  actions: read      # to download Agent 3's latest posts artifact

concurrency:
  group: ops-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - run: pip install -r requirements.txt
      - name: Sync
        env:
          BASE44_ACCESS_TOKEN: ${{ secrets.BASE44_ACCESS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_REVIEW_DB: ${{ vars.NOTION_REVIEW_DB }}
          # reads the draft text from the article PRs on the four site repos
          GITHUB_TOKEN: ${{ secrets.ASTRO_GITHUB_TOKEN }}
          # on since 25 Oct 2026: the app's ArticleReview has image_url (visual redesign)
          OPS_ARTICLE_IMAGES: ${{ vars.OPS_ARTICLE_IMAGES || '1' }}
          # the Commons fallback vets each candidate photo with the model (images.suitable)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ inputs.mode || 'apply' }}
        run: |
          set -o pipefail   # `| tee` must not turn a crash green
          case "$MODE" in
            probe)   python3 tools/ops_sync.py --probe | tee -a "$GITHUB_STEP_SUMMARY" ;;
            dry_run) python3 tools/ops_sync.py | tee -a "$GITHUB_STEP_SUMMARY" ;;
            images_dry_run) python3 tools/ops_sync.py --backfill-images | tee -a "$GITHUB_STEP_SUMMARY" ;;
            images_apply)   python3 tools/ops_sync.py --backfill-images --apply | tee -a "$GITHUB_STEP_SUMMARY" ;;
            *)       python3 tools/ops_sync.py --apply | tee -a "$GITHUB_STEP_SUMMARY" ;;
          esac
      - name: Today tab (agents, health lines, metrics from reports/health-latest.json)
        if: always() && (inputs.mode || 'apply') != 'probe'
        env:
          BASE44_ACCESS_TOKEN: ${{ secrets.BASE44_ACCESS_TOKEN }}
          MODE: ${{ inputs.mode || 'apply' }}
        run: |
          set -o pipefail
          if [ "$MODE" = "apply" ]; then A="--apply"; else A=""; fi
          python3 tools/ops_today.py $A | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Find Agent 3's latest posts
        id: a3
        if: always() && (inputs.mode || 'apply') != 'probe'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --workflow agent3-broadcaster.yml --status success --limit 1 \
                --json databaseId --jq '.[0].databaseId' --repo "${{ github.repository }}" || true)
          [ -n "$RUN" ] && [ "$RUN" != "null" ] && echo "run_id=$RUN" >> "$GITHUB_OUTPUT" || echo "no Agent 3 run found"
      - uses: actions/download-artifact@v5
        if: always() && steps.a3.outputs.run_id != ''
        continue-on-error: true
        with:
          name: agent3-broadcast
          path: orchestrator/social_in
          run-id: ${{ steps.a3.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Social tab (Agent 3's held posts; nothing is published from here)
        if: always() && (inputs.mode || 'apply') != 'probe'
        env:
          BASE44_ACCESS_TOKEN: ${{ secrets.BASE44_ACCESS_TOKEN }}
          MODE: ${{ inputs.mode || 'apply' }}
        run: |
          set -o pipefail
          if [ "$MODE" = "apply" ]; then A="--apply"; else A=""; fi
          python3 tools/ops_social.py --posts social_in $A | tee -a "$GITHUB_STEP_SUMMARY"
