# Agent 3 — Broadcaster
# Architecture credit: Albaloo Studio — albaloostudio.com
# Owner: Alireza Mozaffari
#
# Chained off Agent 2, which is chained off Agent 1. The whole line —
# scout, write, broadcast — now runs on one trigger at 04:15 UTC with no
# webhooks between the stages, because all three live in the same place.
#
# NOTHING IS POSTED BY THIS WORKFLOW. Live posting needs two independent
# yeses: ALLOW_AUTOPOST=1 here AND autopost: true on that channel in
# sites.yml. Every account_ref in the registry is null today, so the
# scheduler composes and holds. That is the designed state — the copy is
# worth writing and reviewing before an account exists to send it from.

name: Agent 3 — Broadcaster

on:
  workflow_run:
    workflows: ["Agent 2 — Writer"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Agent 2 run ID to take events from (blank = latest successful)"
        required: false
        type: string
      limit:
        description: "Max events to broadcast (0 = all)"
        required: false
        default: "5"
        type: string
      no_llm:
        description: "Skip Claude — exercise channels, gate and scheduler only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: agent3-broadcaster
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    defaults:
      run:
        working-directory: orchestrator

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve which writer run to read
        id: writer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN="${{ inputs.run_id || github.event.workflow_run.id }}"
          if [ -z "$RUN" ]; then
            RUN=$(gh run list --workflow agent2-writer.yml --status success \
                    --limit 1 --json databaseId --jq '.[0].databaseId' \
                    --repo "${{ github.repository }}")
            if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
              echo "::error title=No writer run::No successful Agent 2 run to take events from."
              exit 1
            fi
            echo "::notice title=Using latest writer run::$RUN"
          fi
          echo "run_id=$RUN" >> "$GITHUB_OUTPUT"

      - name: Fetch the publishing events Agent 2 produced
        uses: actions/download-artifact@v5
        with:
          name: agent2-written
          path: orchestrator/inbox
          run-id: ${{ steps.writer.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the events merge-watch verified as LIVE
        # These are the ones worth broadcasting. Agent 2's own events carry
        # live_url: null by design — a pull request is not a page — and Agent 3
        # correctly skips every one of them. That is why 29 runs "succeeded"
        # having posted nothing: it was reading drafts and declining to link to
        # them, exactly as written.
        #
        # merge_watch promotes an event only once the SERVER serves the page,
        # and writes it to promoted/. Nothing consumed that until now, so the
        # chain stopped one step short of the agent it was built for.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MW=$(gh run list --workflow merge-watch.yml --status success --limit 1                  --json databaseId --jq '.[0].databaseId'                  --repo "${{ github.repository }}" 2>/dev/null || true)
          if [ -n "${MW:-}" ] && [ "$MW" != "null" ]; then
            mkdir -p promoted_dl
            gh run download "$MW" --name merge-watch --dir promoted_dl                --repo "${{ github.repository }}" 2>/dev/null || true
          fi
          ls -R promoted_dl 2>/dev/null | head -12 || echo "no merge-watch artifact yet"

      - name: Locate the events
        id: locate
        run: |
          set -euo pipefail
          # PROMOTED events win. They carry a live_url that was verified against
          # the server, which is the only kind Agent 3 can act on.
          DIR=$(find promoted_dl -type d -name promoted 2>/dev/null | head -1 || true)
          if [ -n "$DIR" ] && [ -n "$(ls -A "$DIR" 2>/dev/null)" ]; then
            echo "found=$DIR" >> "$GITHUB_OUTPUT"
            echo "$(ls "$DIR" | wc -l) LIVE event(s) from merge-watch in $DIR"
            exit 0
          fi

          # Fall back to Agent 2's raw events. Every one will be skipped for a
          # null live_url, which is correct and is worth SAYING rather than
          # reporting as a clean run with nothing in it.
          # A --no-llm writer run produces drafts but no events, and a run where
          # every brief was blocked produces neither. Find the directory rather
          # than assume it exists.
          DIR=$(find inbox -type d -name events | head -1 || true)
          if [ -z "$DIR" ] || [ -z "$(ls -A "$DIR" 2>/dev/null)" ]; then
            echo "::notice title=Nothing to broadcast::Agent 2 emitted no publishing events in that run, and merge-watch has promoted none."
            echo "found=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice title=Only drafts available::merge-watch has promoted nothing live, so these are Agent 2 drafts and every one will be skipped for a null live_url. That is the gate working, not a failure."
          echo "found=$DIR" >> "$GITHUB_OUTPUT"
          echo "$(ls "$DIR" | wc -l) draft event(s) in $DIR"

      - name: Compose, gate and queue
        if: steps.locate.outputs.found != ''
        env:
          # Channel copy runs on PROSE_PROVIDER (default gemini). It moved off
          # Anthropic on 12 Aug 2026 with the rest of the scheduled work: an
          # agent on a cron should not depend on a balance nobody is watching.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          PROSE_PROVIDER: ${{ vars.PROSE_PROVIDER || 'gemini' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
          # Deliberately NOT set. Live posting requires this to be 1 AND
          # autopost:true on the channel. Leaving it unset is the outer of the
          # two locks, and it stays unset until a brand account exists.
          # ALLOW_AUTOPOST: "1"
          SCHEDULER_BACKEND: ${{ vars.SCHEDULER_BACKEND || 'file' }}
          SCHEDULER_BASE_URL: ${{ secrets.SCHEDULER_BASE_URL }}
          SCHEDULER_API_KEY: ${{ secrets.SCHEDULER_API_KEY }}
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
          PIPELINE_ENVIRONMENT: production
        run: |
          set -euo pipefail
          ARGS="--events ${{ steps.locate.outputs.found }} --out broadcast"
          if [ "${{ inputs.limit || '5' }}" != "0" ]; then ARGS="$ARGS --limit ${{ inputs.limit || '5' }}"; fi

          if [ "${{ inputs.no_llm }}" = "true" ] || [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
              echo "::notice title=No Anthropic key::ANTHROPIC_API_KEY is not set. Running --no-llm: channel resolution, the compliance gate, the media pre-flight and campaign.log assembly are exercised, but the copy is assembled from the publication and is NOT publishable."
            fi
            ARGS="$ARGS --no-llm"
          fi

          python3 agent3_broadcaster_batch.py $ARGS

      - name: Summarise
        if: always() && steps.locate.outputs.found != ''
        run: |
          set -euo pipefail
          [ -f broadcast/manifest.json ] || exit 0
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("broadcast/manifest.json", encoding="utf-8"))
          print("## Agent 3 — Broadcaster\n")
          if m.get("no_llm"):
              print("> **Structural run — no model was called.** The copy is assembled "
                    "from the publication and is not publishable.\n")
          print(f"{m['composed']} composed · {m['blocked']} blocked · "
                f"{m['skipped']} skipped · {m['failed']} failed "
                f"(of {m['events_seen']} events)\n")
          print(f"**{m['posts_total']} post(s)** — {m['posts_held']} held at the autopost "
                f"gate, {m['posts_blocked_media']} blocked for missing media.\n")
          print("> Nothing was published. `ALLOW_AUTOPOST` is unset and every "
                "`account_ref` in sites.yml is null.\n")
          print("| Campaign | Title | Status | Posts | Held | No media |")
          print("|---|---|---|---:|---:|---:|")
          for o in m["outcomes"]:
              print(f"| `{o['campaign_id']}` | {o['title'][:44]} | {o['status']} | "
                    f"{o['posts']} | {o['held']} | {o['blocked_media']} |")
          print("\n*Architecture credit: Albaloo Studio*")
          PY

      - name: Upload campaigns and queued posts
        if: always() && steps.locate.outputs.found != ''
        uses: actions/upload-artifact@v6
        with:
          name: agent3-broadcast
          path: |
            orchestrator/broadcast/
            orchestrator/queue/
          retention-days: 90
          if-no-files-found: warn
