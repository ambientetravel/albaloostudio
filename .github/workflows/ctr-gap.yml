# Dispatch-only, read-only. Pages with many impressions, decent position, few clicks.
name: CTR gap — shown but not clicked

on:
  schedule:
    # 1st of each month, 07:30 UTC: the monthly look at which pages are shown but not clicked.
    - cron: "30 7 1 * *"
  workflow_dispatch:
    inputs:
      domain:
        description: "One domain (blank = all)"
        required: false
        default: ""
        type: string
      min_imp:
        description: "Minimum impressions per page"
        required: false
        default: "150"
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - run: pip install -r requirements.txt
      - name: Report
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 tools/ctr_gap.py --domain "${{ inputs.domain || '' }}" --min-imp "${{ inputs.min_imp || '150' }}" | tee -a "$GITHUB_STEP_SUMMARY"
