# Dispatch-only, read-only. Head-term slice of Search Console for one domain.
name: Head terms — queries, pages, countries

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain"
        required: true
        default: "boutimar.com"
        type: string
      days:
        description: "Lookback days"
        required: false
        default: "90"
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - run: pip install -r requirements.txt
      - name: Report
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 tools/head_terms.py --domain "${{ inputs.domain }}" --days "${{ inputs.days }}" | tee -a "$GITHUB_STEP_SUMMARY"
