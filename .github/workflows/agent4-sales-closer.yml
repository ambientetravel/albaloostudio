# Agent 4 — Sales Closer
# Architecture credit: Albaloo Studio — albaloostudio.com
# Owner: Alireza Mozaffari
#
# workflow_dispatch ONLY — deliberately no cron.
#
# Agents 1, 2 and 3 chain nightly because each has real input waiting: Search
# Console data, then briefs, then publishing events. Agent 4 has no lead source
# wired. A nightly run would register campaigns, find zero leads and report a
# green no-op every morning, which is how a green tick stops meaning anything.
#
# 30 Sep 2026: leads now arrive. cruise24.me stores its enquiries and serves them
# on a signed GET (api/leads.php, `lead_source` in sites.yml). The schedule below
# pulls every site with a lead_source every four hours — but ONLY once the repo
# secret LEADS_SIGNING_SECRET exists (the same value as that site's
# api/config.php signing_secret). Without it the scheduled run says so and stops,
# rather than failing red every four hours or reporting a green no-op.
#
# NOTHING IS SENT. Agent 4 has no delivery path at all: no SMTP, no webhook to
# a customer, nothing. Replies land in the artifact for a human to read, edit
# and send. A wrong price or a wrong visa claim cannot be recalled once it
# reaches a real person.

name: Agent 4 — Sales Closer

on:
  schedule:
    - cron: "23 */4 * * *"     # every four hours; pulls each site's lead_source
  workflow_dispatch:
    inputs:
      leads_path:
        description: "Path in the repo to a JSONL/JSON array of inbound leads (blank = pull from URLs)"
        required: false
        type: string
      leads_url:
        description: "Pull from this URL instead (blank = every lead_source in sites.yml)"
        required: false
        type: string
      campaigns_run_id:
        description: "Agent 3 run ID for attribution (blank = latest successful)"
        required: false
        type: string
      limit:
        description: "Max leads to qualify (0 = all)"
        required: false
        default: "0"
        type: string
      no_llm:
        description: "Skip Claude — exercise redaction, attribution and gate only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: agent4-sales-closer
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: orchestrator

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Choose the lead sources
        id: leads
        env:
          LEADS_PATH: ${{ inputs.leads_path }}
          LEADS_URL: ${{ inputs.leads_url }}
          HAS_LEADS_SECRET: ${{ secrets.LEADS_SIGNING_SECRET != '' }}
        run: |
          set -euo pipefail
          if [ -n "${LEADS_PATH:-}" ]; then
            P="../$LEADS_PATH"
            if [ ! -f "$P" ]; then
              echo "::error title=No leads file::$LEADS_PATH does not exist in the repository."
              exit 1
            fi
            echo "path=$P" >> "$GITHUB_OUTPUT"
            echo "$(wc -l < "$P") line(s) in $LEADS_PATH"
            exit 0
          fi
          if [ "$HAS_LEADS_SECRET" != "true" ]; then
            echo "::notice title=Lead pull not set up::Repo secret LEADS_SIGNING_SECRET is missing, so no site's leads can be pulled. Set it to the signing_secret in the site's api/config.php. Nothing ran."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${LEADS_URL:-}" ]; then
            URLS="$LEADS_URL"
          else
            URLS=$(python3 -c "import config; print(' '.join(s.lead_source for s in config.load_sites() if s.lead_source))")
          fi
          if [ -z "$URLS" ]; then
            echo "::notice title=No lead sources::No site in sites.yml has a lead_source. Nothing ran."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "urls=$URLS" >> "$GITHUB_OUTPUT"
          echo "Pulling leads from: $URLS"

      - name: Resolve the broadcaster run for attribution
        if: steps.leads.outputs.skip != 'true'
        id: b
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true      # attribution is useful, not required
        run: |
          set -euo pipefail
          RUN="${{ inputs.campaigns_run_id }}"
          if [ -z "$RUN" ]; then
            RUN=$(gh run list --workflow agent3-broadcaster.yml --status success \
                    --limit 1 --json databaseId --jq '.[0].databaseId' \
                    --repo "${{ github.repository }}" || true)
          fi
          [ -n "$RUN" ] && [ "$RUN" != "null" ] && echo "run_id=$RUN" >> "$GITHUB_OUTPUT" || \
            echo "::notice title=No campaigns::No Agent 3 run found — leads will be qualified without attribution."

      - name: Fetch campaign logs
        if: steps.leads.outputs.skip != 'true' && steps.b.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: agent3-broadcast
          path: orchestrator/inbox
          run-id: ${{ steps.b.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Qualify
        if: steps.leads.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
          LEADS_SIGNING_SECRET: ${{ secrets.LEADS_SIGNING_SECRET }}
          PIPELINE_ENVIRONMENT: production
          LEADS_FILE: ${{ steps.leads.outputs.path }}
          LEADS_URLS: ${{ steps.leads.outputs.urls }}
          LIMIT: ${{ inputs.limit || '0' }}
          NO_LLM: ${{ inputs.no_llm || false }}
        run: |
          set -euo pipefail
          COMMON=""
          CDIR=$(find inbox -type d -name campaigns 2>/dev/null | head -1 || true)
          if [ -n "$CDIR" ]; then COMMON="$COMMON --campaigns $CDIR"; fi
          if [ "$LIMIT" != "0" ]; then COMMON="$COMMON --limit $LIMIT"; fi
          if [ "$NO_LLM" = "true" ] || [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
              echo "::notice title=No Anthropic key::Running --no-llm: redaction, attribution, the compliance gate and escalation are exercised, but no reply is drafted."
            fi
            COMMON="$COMMON --no-llm"
          fi

          if [ -n "${LEADS_FILE:-}" ]; then
            python3 agent4_sales_closer_batch.py --leads "$LEADS_FILE" --out closed $COMMON
            exit 0
          fi
          FAILED=0
          for U in $LEADS_URLS; do
            HOST=$(python3 -c "import sys,urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).hostname)" "$U")
            echo "::group::$HOST"
            python3 agent4_sales_closer_batch.py --leads-url "$U" --out "closed/$HOST" $COMMON || FAILED=1
            echo "::endgroup::"
          done
          exit $FAILED

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          ls closed/manifest.json closed/*/manifest.json >/dev/null 2>&1 || exit 0
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          for path in sorted(glob.glob("closed/manifest.json") + glob.glob("closed/*/manifest.json")):
            m = json.load(open(path, encoding="utf-8"))
            src = path.split("/")[1] if path.count("/") == 2 else "leads file"
            print(f"## Agent 4 — Sales Closer · {src}\n")
            if m.get("no_llm"):
                print("> **Structural run — no model was called.** No replies were drafted.\n")
            print(f"{m['qualified']} qualified · {m['blocked_replies']} replies blocked · "
                  f"{m['failed']} failed (of {m['leads_seen']} leads)\n")
            print(f"**{m['escalated']} escalated to a human** · {m['with_draft']} drafts · "
                  f"{m['leads_containing_pii']} contained PII (redacted before the model) · "
                  f"{m['attributed']} attributed to a campaign\n")
            print(f"> **{m['sent']} sent.** {m['sent_note']}\n")
            print("| Lead | Channel | Status | Intent | Score | Escalated | Redacted |")
            print("|---|---|---|---|---:|---|---|")
            for o in m["outcomes"]:
                print(f"| `{o['lead_id'] or o['lead_ref']}` | {o['channel']} | {o['status']} | "
                      f"{o['intent'] or '—'} | {o['score']} | "
                      f"{'yes' if o['escalated'] else ''} | {', '.join(o['redactions']) or ''} |")
          print("\n*Architecture credit: Albaloo Studio*")
          PY

      # Retention is short on purpose. These records hold redacted customer
      # messages — real people's words, even with the card numbers stripped.
      # 90 days is right for a build artifact and wrong for correspondence.
      - name: Upload drafts and escalations
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent4-closed
          path: orchestrator/closed/
          retention-days: 7
          if-no-files-found: warn
