# Albaloo Orchestration Pipeline — compare two Search Console properties.
# Architecture credit: Albaloo Studio — albaloostudio.com
# Owner: Alireza Mozaffari
#
# ambientetravel.com has a domain property AND a URL-prefix property on
# https://www.ambientetravel.com/. www 301s to the apex and the page canonicals
# to the apex, so the www property should be near-empty — and it reports MORE
# impressions and clicks. Dispatch-only: this answers a question, it is not a
# monitor.

name: Compare two Search Console properties

on:
  workflow_dispatch:
    inputs:
      property_a:
        description: "First property (exact Search Console resource id)"
        required: false
        default: "sc-domain:ambientetravel.com"
        type: string
      property_b:
        description: "Second property"
        required: false
        default: "https://www.ambientetravel.com/"
        type: string
      days:
        description: "Window in days"
        required: false
        default: "180"
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compare
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python3 tools/property_compare.py \
            --a "${{ inputs.property_a || 'sc-domain:ambientetravel.com' }}" \
            --b "${{ inputs.property_b || 'https://www.ambientetravel.com/' }}" \
            --days "${{ inputs.days || '180' }}" >> "$GITHUB_STEP_SUMMARY"
