<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0}

.cover{width:1584px;height:396px;position:relative;overflow:hidden;background:linear-gradient(100deg,#070f18 0%,#0c1824 45%,#14243a 100%);color:#eef3f7}

.logo img{width:300px}

  <div class="txt">
