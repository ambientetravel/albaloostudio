      type: base44
      adapter: base44_entity
      content_root: "/"
      publish_mode: draft
    channels:
      - name: linkedin
        audience: b2b
        autopost: false
        account_ref: null          # not connected to the scheduler yet

  - domain: cruisebaz.com
    property_uri: "sc-domain:cruisebaz.com"
    brand: CruiseBaz
    locale: fa-IR
    market: IR
    base_url: "https://cruisebaz.com"
    sitemap: "https://cruisebaz.com/sitemap.xml"
    cms:
      type: base44
