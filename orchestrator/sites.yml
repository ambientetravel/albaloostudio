# Albaloo Orchestration Pipeline — the domain registry.
# Architecture credit: Albaloo Studio — albaloostudio.com
#
# This is the ONLY place a domain is declared. Agent 1 reads it at boot; no
# other module hardcodes a hostname. Adding a brand = adding a block here.
#
# property_uri must match Search Console exactly. Domain properties
# (`sc-domain:`) are preferred so www/apex/http/https roll into one row; use a
# URL-prefix property (`https://example.com/`) only where a domain property was
# never verified.
#
# channels[].account_ref is the scheduler's account ID. Every one is null today:
# the only account connected to the scheduler is instagram/mozzafiatojourney,
# which is a personal hobby page and is deliberately NOT wired to any brand.
# See SETUP-SOCIAL.md for what to connect where. Until an account_ref is filled
# in, Agent 3 composes the copy and holds it in the file queue — it cannot reach
# a platform it has no account for.
#
# Two channel facts that decide the order of work:
#   * Telegram takes text-only posts, needs no Business-account conversion, and
#     is where Iranian travel buying actually happens. It is the fastest channel
#     to get live and the right primary for the fa-IR brands.
#   * Instagram will not accept a text-only post. A post with no image is held
#     with `status: blocked`, not attempted — see scheduler.py MEDIA_REQUIRED.

defaults:
  lookback_days: 90            # GSC window for the demand signal
  trend_window_days: 28        # short window compared against the long one
  data_lag_days: 3             # GSC is ~2 days behind; never query today
  # Calibrated against real Search Console data, 8 Aug 2026. The original 150 is
  # a sane floor for an established site and produced ZERO candidates across the
  # whole portfolio: boutimar.com's best query in 90 days was 79 impressions,
  # boutimar.ir's was 23. At this traffic level a high floor is not caution, it
  # is blindness. Raise these as the sites grow.
  min_impressions: 5           # below this a query is noise, not a gap
  max_position: 40             # beyond page 4 there is no proximity to exploit
  max_briefs_per_run: 5
  compliance_profile: boutimar_v1
  status: active               # active | hold — see the note below

  # PINNED. The audit score counts findings, so it moves with how many pages
  # were sampled — a run at 3 and a run at 10 are not comparable, and comparing
  # them produces an imaginary trend. The cron never passes --sample; it takes
  # this value, so every scheduled run measures the same way. Change it and you
  # restart the trend line: old scores stop being comparable to new ones.
  audit_sample_pages: 10

sites:
  - domain: boutimar.com
    property_uri: "sc-domain:boutimar.com"
    gsc_account: "alimozzarella@gmail.com"
    brand: Boutimar
    locale: en
    market: INT
    base_url: "https://boutimar.com"
    sitemap: "https://boutimar.com/sitemap.xml"    # verified 2026-08-06; not sitemap_index.xml
    min_impressions: 20        # 361 queries / 1,233 impressions in 90d — 20 yields ~10 candidates
    cms:
      # NOT WordPress. Corrected 11 Aug 2026 after the WordPress adapter was
      # built and pointed here: /wp-admin, /wp-json and /wp-login.php all
      # return 404, the generator meta says astro, and package.json depends on
      # astro + @astrojs/sitemap. The site was rebuilt as a static Astro build
      # driven by JSON in src/data/ — experiences, itineraries, iran-visa,
      # hotel-rates, cities. The old WordPress+Elementor+Woo install is gone.
      #
      # astro_pr, same as exploreorient: Agent 2 writes a content file and
      # opens a pull request against ambientetravel/boutimar. Nothing reaches
      # the live site without a human merging it, which is the right shape for
      # a site with no CMS to hold a draft.
      type: astro
      adapter: astro_pr
      content_root: "src/content/"
      publish_mode: draft
    channels:
      - name: linkedin
        audience: b2b
        autopost: false
        account_ref: null          # not connected to the scheduler yet
      - name: instagram
        audience: d2c
        autopost: false
        account_ref: null          # needs a BRAND Instagram (Business acct + FB Page)
        requires_media: true

  - domain: boutimar.ir
    property_uri: "sc-domain:boutimar.ir"
    gsc_account: "alimozzarella@gmail.com"
    brand: Boutimar
    locale: fa-IR
    market: IR
    base_url: "https://boutimar.ir"
    sitemap: "https://boutimar.ir/sitemap.xml"
    cms:
      type: static
      adapter: boutimar_ir_static
      content_root: "/"
      publish_mode: draft
    data_dependencies:
      - field: price_from
        source: "https://boutimar.ir/api/cruises.php"
    channels:
      - name: telegram
        audience: d2c
        autopost: false
        account_ref: null          # not connected to the scheduler yet
      - name: instagram
        audience: d2c
        autopost: false
        account_ref: null          # needs a BRAND Instagram (Business acct + FB Page)
        requires_media: true

  - domain: exploreorient.com
    property_uri: "sc-domain:exploreorient.com"
    gsc_account: "contactmozaffari@gmail.com"
    brand: Explore Orient
    locale: en
    market: INT
    base_url: "https://exploreorient.com"
    sitemap: "https://exploreorient.com/sitemap-index.xml"
    cms:
      type: astro
      adapter: astro_pr          # opens a PR against the exploreorient repo
      content_root: "src/content/"
      publish_mode: draft
    channels:
      - name: linkedin
        audience: b2b
        autopost: false
        account_ref: null          # not connected to the scheduler yet

  - domain: ambientetravel.com
    # Kept as sc-domain: DELIBERATELY, even though a property already exists.
    # The existing one is https://www.ambientetravel.com/ — the www host, which
    # 301s to the apex. A URL-prefix property only reports URLs under its own
    # prefix, so a property on a hostname that serves nothing but a redirect
    # reports almost nothing. That is not a property worth pointing an agent at.
    # The fix is a Domain property, which rolls up apex, www, http and https in
    # one. It needs a TXT record at WIX (ns12.wixdns.net serves this zone) —
    # adding it at GoDaddy, where the domain is registered, has no effect.
    property_uri: "sc-domain:ambientetravel.com"
    gsc_account: "contactmozaffari@gmail.com"
    brand: Ambiente Travel
    locale: en
    market: DACH
    base_url: "https://ambientetravel.com"
    sitemap: "https://ambientetravel.com/sitemap.xml"
    cms:
      type: base44
      adapter: base44_entity
      content_root: "/"
      publish_mode: draft
    channels:
      - name: linkedin
        audience: b2b
        autopost: false
        account_ref: null          # not connected to the scheduler yet

  - domain: cruisebaz.com
    # URL-prefix, not sc-domain, because this is the property that ACTUALLY
    # EXISTS (confirmed 9 Aug 2026) and it happens to be on the right host:
    # www.cruisebaz.com 301s to the apex, so the apex prefix sees everything
    # Google indexes. Asking for sc-domain: was requesting a property nobody
    # ever created, which is the whole reason this domain returned 403.
    # A domain property would still be tidier one day; it is not worth a DNS
    # round-trip when this one already has full coverage.
    property_uri: "https://cruisebaz.com/"
    gsc_account: "UNCONFIRMED"
    brand: CruiseBaz
    locale: fa-IR
    market: IR
    base_url: "https://cruisebaz.com"
    sitemap: "https://cruisebaz.com/sitemap.xml"
    cms:
      type: base44
      adapter: base44_entity
      content_root: "/"
      publish_mode: draft
    channels:
      - name: telegram
        audience: d2c
        autopost: false
        account_ref: null          # ← fastest channel to get live: text-only, no Meta
      - name: instagram
        audience: d2c
        autopost: false
        account_ref: null          # needs a BRAND Instagram (Business acct + FB Page)
        requires_media: true

  - domain: cruise24.ir
    property_uri: "sc-domain:cruise24.ir"
    gsc_account: "alimozzarella@gmail.com"
    brand: Cruise24
    # OFF HOLD 2026-08-09. It was a 375-byte coming-soon page on 6 Aug; it now
    # serves a real 31KB storefront — "Search 2,200+ sailings from MSC, Explora
    # Journeys, Celestyal and AROYA".
    #
    # locale is `en` because that is what the site ACTUALLY declares and serves
    # today, and the audit's lang check compares against this field. The Farsi
    # build for the Iranian audience lands around mid-August 2026; when it does,
    # THIS LINE MUST BECOME fa-IR. Declaring fa-IR early would flag every page
    # as a language mismatch for a week and train everyone to ignore the rule.
    locale: en                 # → fa-IR when the Farsi build ships
    market: IR
    status: active
    base_url: "https://cruise24.ir"
    sitemap: "https://cruise24.ir/sitemap.xml"   # 404 as of 2026-08-09 — see below
    cms:
      type: static
      adapter: static_bundle     # Netafraz/nginx; Agent 2 emits a deploy bundle
      content_root: "/"
      publish_mode: draft
    channels:
      - name: telegram
        audience: d2c
        autopost: false
        account_ref: null          # text-only, no Meta review — fastest channel for IR
    notes:
      - "No sitemap.xml and no robots.txt (both 404 on 2026-08-09)."
      - "Zero JSON-LD blocks."

  - domain: cruise24.me
    property_uri: "sc-domain:cruise24.me"
    gsc_account: "contactmozaffari@gmail.com"
    brand: Cruise24
    locale: en
    market: INT                # the world-audience twin of cruise24.ir
    base_url: "https://cruise24.me"
    sitemap: "https://cruise24.me/sitemap.xml"   # a sitemap INDEX, not a urlset
    cms:
      type: godaddy_builder
      # GoDaddy Website Builder is a closed platform: no REST API, no file
      # access, no repo. `unimplemented` is deliberate and load-bearing — it
      # routes Agent 2 down the stage-the-draft path. Any other adapter name
      # falls through to the generic branch, which returns a live_url for a page
      # it never created, and an adapter must never report a URL it did not make.
      adapter: unimplemented
      content_root: "/"
      publish_mode: draft
    channels:
      - name: linkedin
        audience: b2b
        autopost: false
        account_ref: null
    notes:
      - "Declares lang=\"tr-TR\" while serving English to a world audience."
      - "Sitemap index resolves to 2 URLs total across both child sitemaps."

  - domain: albaloostudio.com
    property_uri: "sc-domain:albaloostudio.com"
    gsc_account: "contactmozaffari@gmail.com"
    brand: Albaloo Studio
    locale: en
    market: INT
    base_url: "https://albaloostudio.com"
    sitemap: "https://albaloostudio.com/sitemap.xml"   # 404 as of 2026-08-09
    # The studio this whole pipeline is credited to, now watched by it. A few
    # static pages on GoDaddy/Apache: music, AI video, and the sites it builds.
    # Small surface, so it is here for oversight rather than for a content
    # programme — expect few briefs and a short audit.
    compliance_profile: boutimar_v1   # the travel rules are inert here; the
                                      # invented-facts and price rules are not
    cms:
      type: static
      adapter: unimplemented     # hand-built; no push target
      content_root: "/"
      publish_mode: draft
    channels: []
    notes:
      - "No meta description on the homepage, no sitemap.xml, no robots.txt."

  - domain: cruiseshop.ir
    property_uri: "sc-domain:cruiseshop.ir"
    gsc_account: "alimozzarella@gmail.com"
    brand: CruiseShop
    locale: fa-IR
    market: IR
    base_url: "https://cruiseshop.ir"
    sitemap: "https://cruiseshop.ir/sitemap.xml"
    cms:
      # Also being rebuilt as JSON-driven static (11 Aug 2026). static_bundle
      # is already the right adapter; switch to astro_pr if the rebuild lands
      # in a git repo, as boutimar.com did.
      type: static
      adapter: static_bundle
      content_root: "/"
      publish_mode: draft
    channels: []

  - domain: dmciran.ir
    property_uri: "sc-domain:dmciran.ir"
    gsc_account: "alimozzarella@gmail.com"
    brand: DMC Iran
    locale: fa-IR
    market: IR
    base_url: "https://dmciran.ir"
    sitemap: "https://dmciran.ir/sitemap.xml"
    cms:
      # WordPress TODAY (/wp-admin and /wp-json/wp/v2 both answer 200), but
      # being rebuilt as a JSON-driven static site like boutimar.com. So
      # wordpress_rest is deliberately NOT used: wiring an adapter to a stack
      # that is on its way out means writing drafts into an admin nobody will
      # open again, and re-doing the work after the migration.
      #
      # static_bundle writes a deploy bundle instead, which is what the rebuilt
      # site will want anyway. Switch to astro_pr once it has a repo.
      #
      # As of 11 Aug 2026 NO property in this portfolio uses wordpress_rest.
      # The adapter is kept because it is written and tested, not because
      # anything needs it.
      type: static
      adapter: static_bundle
      content_root: "/"
      publish_mode: draft
    channels:
      - name: linkedin
        audience: b2b
        autopost: false
        account_ref: null          # not connected to the scheduler yet
