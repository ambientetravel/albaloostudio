<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f9bbf"/><stop offset=".55" stop-color="#e6d3bd"/><stop offset="1" stop-color="#f3d9b0"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f86ad"/><stop offset="1" stop-color="#1d3b5c"/></linearGradient>
 <linearGradient id="teak" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a4029"/><stop offset=".5" stop-color="#8a6642"/><stop offset="1" stop-color="#5a4029"/></linearGradient>
 <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151a22"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<rect y="470" width="1600" height="200" fill="url(#sea)"/>
<g opacity=".35" stroke="#f3e2c2" stroke-width="2"><path d="M0 520 Q400 505 800 520 T1600 520"/><path d="M0 570 Q400 585 800 570 T1600 570"/></g>
<!-- deck and rail -->
<rect y="640" width="1600" height="260" fill="url(#teak)"/>
<g opacity=".25" stroke="#2c1c10"><path d="M0 680 H1600"/><path d="M0 730 H1600"/><path d="M0 790 H1600"/><path d="M0 850 H1600"/></g>
<rect y="455" width="1600" height="10" fill="#e9e2d5"/><rect y="465" width="1600" height="180" fill="#dfe8f0" opacity=".28"/>
<g fill="#e9e2d5"><rect x="180" y="465" width="6" height="180"/><rect x="800" y="465" width="6" height="180"/><rect x="1420" y="465" width="6" height="180"/></g>
<!-- door frame we are about to enter (dark surround) -->
<path d="M0 0 H1600 V900 H0 Z M300 60 H1300 V900 H300 Z" fill="url(#frame)" fill-rule="evenodd"/>
<rect x="300" y="60" width="1000" height="840" fill="none" stroke="#c9a96a" stroke-width="3" opacity=".5"/>
<rect x="300" y="60" width="1000" height="840" fill="#ffffff" opacity=".06"/>
</svg>
