<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2622"/><stop offset="1" stop-color="#15130f"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2f26"/><stop offset="1" stop-color="#1a1511"/></linearGradient>
 <linearGradient id="view" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb0d2"/><stop offset=".5" stop-color="#e9d5bb"/><stop offset=".52" stop-color="#4a76a3"/><stop offset="1" stop-color="#1d3b5c"/></linearGradient>
 <linearGradient id="linen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f2ea"/><stop offset="1" stop-color="#d9d0c2"/></linearGradient>
 <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#wall)"/>
<rect y="620" width="1600" height="280" fill="url(#floor)"/>
<!-- glass door to the balcony -->
<rect x="880" y="90" width="620" height="560" fill="url(#view)"/>
<rect x="880" y="90" width="620" height="560" fill="none" stroke="#c9a96a" stroke-width="4" opacity=".7"/>
<rect x="1186" y="90" width="4" height="560" fill="#c9a96a" opacity=".6"/>
<rect x="880" y="90" width="620" height="560" fill="#ffffff" opacity=".05"/>
<!-- curtain -->
<path d="M840 70 Q870 400 850 660 L760 660 Q790 400 760 70 Z" fill="#6b5a4a" opacity=".9"/>
<!-- bed -->
<rect x="120" y="470" width="640" height="60" fill="#3c3128"/>
<path d="M120 470 Q440 430 760 470 L760 640 L120 640 Z" fill="url(#linen)"/>
<rect x="150" y="440" width="200" height="60" rx="14" fill="#fbf8f2"/><rect x="380" y="440" width="200" height="60" rx="14" fill="#fbf8f2"/>
<rect x="120" y="560" width="640" height="14" fill="#c9a96a" opacity=".55"/>
<!-- lamp -->
<circle cx="820" cy="380" r="140" fill="url(#lamp)"/><rect x="805" y="360" width="30" height="60" rx="4" fill="#f7e9cf"/>
<!-- caviar & pistachio still life on the side table -->
<rect x="760" y="560" width="120" height="6" fill="#4a3d31"/><rect x="780" y="520" width="80" height="40" rx="4" fill="#2b2b2b"/><circle cx="820" cy="540" r="16" fill="#111"/><circle cx="800" cy="545" r="6" fill="#8aa37b"/><circle cx="842" cy="547" r="6" fill="#8aa37b"/>
<rect width="1600" height="900" fill="#0b1220" opacity=".12"/>
</svg>
