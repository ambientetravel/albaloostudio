<g fill="#f6d9a0" opacity=".7"><circle cx="90" cy="655" r="1.6"/><circle cx="210" cy="660" r="1.4"/><circle cx="350" cy="650" r="1.6"/><circle cx="560" cy="655" r="1.4"/><circle cx="700" cy="660" r="1.6"/><circle cx="830" cy="655" r="1.4"/><circle cx="960" cy="660" r="1.6"/><circle cx="1100" cy="655" r="1.4"/><circle cx="1240" cy="660" r="1.6"/><circle cx="1500" cy="655" r="1.4"/></g>
