<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".45" stop-color="#22355a"/><stop offset=".72" stop-color="#8a6a5a"/><stop offset=".86" stop-color="#d9a074"/><stop offset="1" stop-color="#3b3a4a"/></linearGradient>
